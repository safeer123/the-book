<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!--
      viewport-fit=cover lets the env(safe-area-inset-*) paddings used by the
      mobile pages take effect.
    -->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"
		/>
		<meta name="description" content="Read, listen, and study the Quran" />
		<!-- Kept in sync with the active light/dark theme at runtime (see pwa/theme-color.ts). -->
		<meta name="theme-color" content="#faf7f0" />

		<link rel="manifest" href="%PUBLIC_URL%/site.webmanifest" />
		<link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="%PUBLIC_URL%/favicon-32x32.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="16x16"
			href="%PUBLIC_URL%/favicon-16x16.png"
		/>
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="%PUBLIC_URL%/apple-touch-icon.png"
		/>

		<!-- iOS home-screen app -->
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="The Book" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="format-detection" content="telephone=no" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css?family=Amiri+Quran|Roboto|Inconsolata|Open+Sans&display=swap"
		/>
		<title>The Book</title>
	</head>

	<body>
		<noscript> You need to enable JavaScript to run this app. </noscript>
		<div id="root"></div>
	</body>
</html>
